<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <title>QA-Skills - AI Agent 娴嬭瘯鎶€鑳介泦鍚?/title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --accent-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --success-gradient: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            --danger-gradient: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            --background: #050508;
            --surface: #0f0f18;
            --surface-light: #1a1a28;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b8;
            --border-color: #2a2a40;
            --glow-primary: 0 0 30px rgba(102, 126, 234, 0.5);
            --glow-secondary: 0 0 40px rgba(240, 147, 251, 0.4);
            --glow-intense: 0 0 60px rgba(102, 126, 234, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(102, 126, 234, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(102, 126, 234, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(40px, 40px); }
        }

        .bg-glow {
            position: fixed;
            top: -300px;
            left: -300px;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.2) 0%, rgba(118, 75, 162, 0.1) 40%, transparent 70%);
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
            animation: glowPulse 6s ease-in-out infinite;
        }

        .bg-glow-secondary {
            position: fixed;
            bottom: -250px;
            right: -250px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(240, 147, 251, 0.18) 0%, rgba(245, 87, 108, 0.1) 40%, transparent 70%);
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
            animation: glowPulse 5s ease-in-out infinite reverse;
        }

        .bg-glow-accent {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 1000px;
            height: 1000px;
            background: radial-gradient(circle, rgba(79, 172, 254, 0.08) 0%, transparent 60%);
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
            animation: glowFloat 15s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.3); opacity: 0.8; }
        }

        @keyframes glowFloat {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            33% { transform: translate(-45%, -55%) scale(1.1); }
            66% { transform: translate(-55%, -45%) scale(0.9); }
        }

        nav {
            background: rgba(18, 18, 26, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            letter-spacing: -0.5px;
        }

        .logo svg {
            width: 28px;
            height: 28px;
            color: #667eea;
        }

        .nav-links {
            display: none;
        }

        .nav-links.active {
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: rgba(18, 18, 26, 0.98);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            gap: 0.25rem;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            padding: 0.875rem 1.25rem;
            border-radius: 0.75rem;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--text-primary);
            background: rgba(102, 126, 234, 0.15);
            box-shadow: var(--glow-primary);
        }

        .github-link {
            background: var(--primary-gradient);
            color: white !important;
            padding: 0.75rem 1.5rem !important;
            border-radius: 0.75rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
            transition: all 0.35s ease;
        }

        .github-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.5), var(--glow-primary);
            background: var(--secondary-gradient) !important;
        }

        .github-link svg {
            width: 18px;
            height: 18px;
        }

        .menu-toggle {
            width: 48px;
            height: 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            border: none;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 0.75rem;
            transition: all 0.3s ease;
        }

        .menu-toggle:hover {
            background: rgba(102, 126, 234, 0.2);
        }

        .menu-toggle span {
            width: 20px;
            height: 2px;
            background: var(--text-primary);
            border-radius: 1px;
            transition: all 0.3s ease;
        }

        .menu-toggle.active span:nth-child(1) {
            transform: rotate(45deg) translateY(7px);
        }

        .menu-toggle.active span:nth-child(2) {
            opacity: 0;
        }

        .menu-toggle.active span:nth-child(3) {
            transform: rotate(-45deg) translateY(-7px);
        }

        .hero {
            padding: 9rem 1.5rem 5rem;
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .hero h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 1.25rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
            letter-spacing: -1px;
            text-shadow: var(--glow-primary);
        }

        .hero p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            line-height: 1.7;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 1rem 2rem;
            border-radius: 1rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.35s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.625rem;
            min-width: 150px;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4), var(--glow-primary);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 50px rgba(102, 126, 234, 0.5), var(--glow-primary);
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--surface-light);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--surface);
            border-color: #667eea;
            box-shadow: var(--glow-primary);
            transform: translateY(-2px);
        }

        .btn svg {
            width: 20px;
            height: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            max-width: 400px;
            margin: 0 auto;
            padding: 0 1.5rem 5rem;
            position: relative;
            z-index: 1;
        }

        .stat-card {
            background: linear-gradient(145deg, rgba(26, 26, 36, 0.8), rgba(18, 18, 26, 0.9));
            border-radius: 1.25rem;
            padding: 1.5rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--primary-gradient);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .stat-card:hover,
        .stat-card:active {
            transform: translateY(-5px) scale(1.02);
            border-color: rgba(102, 126, 234, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), var(--glow-primary);
        }

        .stat-card:hover::before {
            transform: scaleX(1);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 900;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.375rem;
            text-shadow: var(--glow-primary);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .section {
            padding: 5rem 1.5rem;
            position: relative;
            z-index: 1;
        }

        .section-title {
            font-size: 1.75rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 3rem;
            color: var(--text-primary);
            position: relative;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -0.75rem;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background: var(--primary-gradient);
            border-radius: 2px;
            box-shadow: var(--glow-primary);
        }

        .skills-grid {
            max-width: 700px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.25rem;
        }

        .skill-card {
            background: linear-gradient(145deg, rgba(26, 26, 36, 0.6), rgba(18, 18, 26, 0.8));
            border-radius: 1.25rem;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .skill-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(102, 126, 234, 0.05), transparent);
            transition: left 0.6s ease;
        }

        .skill-card:hover,
        .skill-card:active {
            transform: translateY(-5px);
            border-color: rgba(102, 126, 234, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), var(--glow-primary);
        }

        .skill-card:hover::before {
            left: 100%;
        }

        .skill-icon {
            width: 52px;
            height: 52px;
            background: var(--primary-gradient);
            border-radius: 1.125rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            font-size: 1.5rem;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
            transition: transform 0.3s ease;
        }

        .skill-card:hover .skill-icon {
            transform: scale(1.1);
        }

        .skill-title {
            font-size: 1.125rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .skill-desc {
            font-size: 0.875rem;
            color: var(--text-secondary);
            line-height: 1.65;
        }

        .hidden-skill {
            display: none;
            opacity: 0;
            transform: translateY(20px);
        }

        .hidden-skill.visible {
            display: block;
            animation: fadeInUp 0.5s ease-out forwards;
        }

        .skills-expand-container {
            display: flex;
            justify-content: center;
            margin-top: 2rem;
        }

        .skills-expand-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.875rem 1.75rem;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 0.875rem;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.9375rem;
            cursor: pointer;
            transition: all 0.35s ease;
        }

        .skills-expand-btn:hover {
            border-color: #667eea;
            color: var(--text-primary);
            background: rgba(102, 126, 234, 0.1);
            box-shadow: var(--glow-primary);
        }

        .skills-expand-btn svg {
            width: 18px;
            height: 18px;
            transition: transform 0.35s ease;
        }

        .skills-expand-btn.expanded svg {
            transform: rotate(180deg);
        }

        .workflow {
            max-width: 700px;
            margin: 0 auto;
        }

        .workflow-steps {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .workflow-step {
            background: linear-gradient(145deg, rgba(26, 26, 36, 0.6), rgba(18, 18, 26, 0.8));
            border-radius: 1.25rem;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s ease;
            display: flex;
            gap: 1.25rem;
            position: relative;
            overflow: hidden;
        }

        .workflow-step::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 3px;
            background: var(--primary-gradient);
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        .workflow-step:hover,
        .workflow-step:active {
            border-color: rgba(102, 126, 234, 0.3);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        .workflow-step:hover::before {
            transform: scaleY(1);
        }

        .step-number {
            width: 44px;
            height: 44px;
            background: var(--primary-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-weight: 800;
            font-size: 1.125rem;
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
            transition: transform 0.3s ease;
        }

        .workflow-step:hover .step-number {
            transform: scale(1.15);
        }

        .step-content {
            flex: 1;
        }

        .step-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.375rem;
            color: var(--text-primary);
        }

        .step-desc {
            font-size: 0.875rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        footer {
            background: linear-gradient(180deg, transparent, rgba(18, 18, 26, 0.9));
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 3rem 1.5rem;
            margin-top: 5rem;
            position: relative;
            z-index: 1;
        }

        .footer-content {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            text-align: center;
        }

        .footer-logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: center;
        }

        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            position: relative;
        }

        .footer-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary-gradient);
            transition: width 0.3s ease;
        }

        .footer-links a:hover {
            color: var(--text-primary);
        }

        .footer-links a:hover::after {
            width: 100%;
        }

        .footer-copyright {
            color: var(--text-secondary);
            font-size: 0.875rem;
            opacity: 0.7;
        }

        @media (min-width: 640px) {
            .hero h1 {
                font-size: 3.5rem;
            }

            .hero p {
                font-size: 1.25rem;
            }

            .stats {
                grid-template-columns: repeat(4, 1fr);
                max-width: 900px;
            }

            .skills-grid {
                grid-template-columns: repeat(2, 1fr);
                max-width: 900px;
            }

            .section-title {
                font-size: 2.25rem;
            }

            .menu-toggle {
                display: none;
            }

            .nav-links {
                display: flex;
                gap: 0.5rem;
                position: static;
                background: transparent;
                border: none;
                padding: 0;
            }

            .nav-links a {
                padding: 0.625rem 1.25rem;
            }
        }

        @media (min-width: 1024px) {
            .hero h1 {
                font-size: 4.5rem;
            }

            .stats {
                max-width: 1100px;
            }

            .skills-grid {
                grid-template-columns: repeat(3, 1fr);
                max-width: 1200px;
            }

            .workflow-steps {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                gap: 1.5rem;
            }

            .workflow-step {
                width: calc(33.333% - 1rem);
                flex-direction: column;
                text-align: center;
                padding: 2rem;
            }

            .workflow-step::before {
                top: 0;
                left: 0;
                right: 0;
                bottom: auto;
                height: 3px;
                width: 100%;
                transform: scaleX(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .hero h1 {
            animation: fadeInUp 0.8s ease-out;
        }

        .hero p {
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .hero-buttons {
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .stat-card {
            animation: fadeInUp 0.6s ease-out backwards;
        }

        .stat-card:nth-child(1) { animation-delay: 0.1s; }
        .stat-card:nth-child(2) { animation-delay: 0.2s; }
        .stat-card:nth-child(3) { animation-delay: 0.3s; }
        .stat-card:nth-child(4) { animation-delay: 0.4s; }

        .skill-card {
            animation: fadeInUp 0.6s ease-out backwards;
        }

        .skill-card:nth-child(1) { animation-delay: 0.1s; }
        .skill-card:nth-child(2) { animation-delay: 0.13s; }
        .skill-card:nth-child(3) { animation-delay: 0.16s; }
        .skill-card:nth-child(4) { animation-delay: 0.19s; }
        .skill-card:nth-child(5) { animation-delay: 0.22s; }
        .skill-card:nth-child(6) { animation-delay: 0.25s; }
        .skill-card:nth-child(7) { animation-delay: 0.28s; }
        .skill-card:nth-child(8) { animation-delay: 0.31s; }
        .skill-card:nth-child(9) { animation-delay: 0.34s; }
        .skill-card:nth-child(10) { animation-delay: 0.37s; }
        .skill-card:nth-child(11) { animation-delay: 0.4s; }
        .skill-card:nth-child(12) { animation-delay: 0.43s; }
        .skill-card:nth-child(13) { animation-delay: 0.46s; }
        .skill-card:nth-child(14) { animation-delay: 0.49s; }
        .skill-card:nth-child(15) { animation-delay: 0.52s; }
        .skill-card:nth-child(16) { animation-delay: 0.55s; }
        .skill-card:nth-child(17) { animation-delay: 0.58s; }
        .skill-card:nth-child(18) { animation-delay: 0.61s; }
        .skill-card:nth-child(19) { animation-delay: 0.64s; }
        .skill-card:nth-child(20) { animation-delay: 0.67s; }
        .skill-card:nth-child(21) { animation-delay: 0.70s; }
        .skill-card:nth-child(22) { animation-delay: 0.73s; }
        .skill-card:nth-child(23) { animation-delay: 0.76s; }
        .skill-card:nth-child(24) { animation-delay: 0.79s; }
        .skill-card:nth-child(25) { animation-delay: 0.82s; }
        .skill-card:nth-child(26) { animation-delay: 0.85s;\n        .skill-card:nth-child(27) { animation-delay: 0.88s; }\n        .skill-card:nth-child(28) { animation-delay: 0.91s; }\n        .skill-card:nth-child(29) { animation-delay: 0.94s; }\n        .skill-card:nth-child(30) { animation-delay: 0.97s; }\n        .skill-card:nth-child(31) { animation-delay: 1.00s; }\n        .skill-card:nth-child(32) { animation-delay: 1.03s; } }
