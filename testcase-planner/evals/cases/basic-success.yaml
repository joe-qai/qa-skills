name: basic-success
description: 给定一份简单登录需求，生成正确的 ITEM/POINT 测试规划

input: |
  需求：用户登录功能
  - 支持用户名密码登录
  - 支持手机验证码登录
  - 密码错误5次锁定30分钟
  - 验证码60秒过期

expected:
  must_contain:
    - "## "
    - "### "
    - "风险等级"
    - "测试关注点"
  must_not_contain:
    - "密码长度小于8"
    - "密码长度8-20"
  assertion: |
    输出应包含至少2个 ITEM（如"登录功能"），
    每个 ITEM 下有独立操作路径的 POINT（如"用户名密码登录"、"手机验证码登录"），
    不应将等价类（密码长度区间）拆为独立 POINT。
